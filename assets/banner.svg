<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Creative Code Lab: small projects, weird experiments, useful tools" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="0.55" stop-color="#1a1038"/>
      <stop offset="1" stop-color="#0b1a2a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6ec7"/>
      <stop offset="0.5" stop-color="#a66bff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a66bff"/>
    </linearGradient>
    <radialGradient id="blobPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff6ec7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff6ec7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <clipPath id="flaskClip">
      <path d="M136 106H164V136L196 200Q204 220 184 220H116Q96 220 104 200L136 136Z"/>
    </clipPath>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <circle cx="160" cy="170" r="190" fill="url(#blobPink)"/>
  <circle cx="1040" cy="90" r="230" fill="url(#blobCyan)"/>

  <!-- window chrome -->
  <circle cx="34" cy="30" r="7" fill="#ff5f56"/>
  <circle cx="58" cy="30" r="7" fill="#ffbd2e"/>
  <circle cx="82" cy="30" r="7" fill="#27c93f"/>
  <text x="1166" y="35" text-anchor="end" font-family="'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#8b95a7">~/Creative-Code-Lab</text>

  <!-- floating code glyphs -->
  <g font-family="'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" fill="#ffffff" fill-opacity="0.10" font-weight="700">
    <text x="470" y="70" font-size="34">{ }</text>
    <text x="760" y="64" font-size="30">&lt;/&gt;</text>
    <text x="1120" y="140" font-size="44">π</text>
    <text x="1100" y="230" font-size="36">∑</text>
    <text x="960" y="262" font-size="28">01101</text>
    <text x="1070" y="296" font-size="30">λ</text>
    <text x="760" y="262" font-size="26">#!/usr/bin</text>
  </g>

  <!-- flask -->
  <g filter="url(#glow)">
    <g clip-path="url(#flaskClip)">
      <rect x="90" y="176" width="130" height="50" fill="url(#liquid)" opacity="0.9">
        <animate attributeName="y" values="176;170;176" dur="3s" repeatCount="indefinite"/>
      </rect>
    </g>
    <path d="M136 106H164V136L196 200Q204 220 184 220H116Q96 220 104 200L136 136Z" fill="#ffffff" fill-opacity="0.06" stroke="url(#title)" stroke-width="4" stroke-linejoin="round"/>
    <rect x="130" y="98" width="40" height="10" rx="5" fill="url(#title)"/>
  </g>
  <!-- bubbles -->
  <circle cx="140" cy="196" r="5" fill="#ffffff" fill-opacity="0.8">
    <animate attributeName="cy" values="204;150;120" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.6;0" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="162" cy="200" r="3.5" fill="#ffffff" fill-opacity="0.8">
    <animate attributeName="cy" values="206;160;128" dur="3.2s" begin="0.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.6;0" dur="3.2s" begin="0.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="204" r="4" fill="#ffffff" fill-opacity="0.8">
    <animate attributeName="cy" values="208;166;134" dur="2.9s" begin="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.6;0" dur="2.9s" begin="1.6s" repeatCount="indefinite"/>
  </circle>
  <!-- sparkles -->
  <g fill="#ffffff">
    <path d="M214 96l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" opacity="0.8">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M86 130l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" opacity="0.6">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- title -->
  <text x="270" y="152" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="88" font-weight="800" fill="url(#title)" letter-spacing="-2">Creative Code Lab</text>

  <!-- subtitle -->
  <text x="274" y="200" font-family="'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="24" fill="#c9d1e0">small projects <tspan fill="#ff6ec7">•</tspan> weird experiments <tspan fill="#22d3ee">•</tspan> useful tools</text>

  <!-- terminal pill -->
  <rect x="274" y="226" width="440" height="52" rx="26" fill="#000000" fill-opacity="0.45" stroke="#ffffff" stroke-opacity="0.15"/>
  <text x="302" y="259" font-family="'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="20" fill="#27c93f">$</text>
  <text x="326" y="259" font-family="'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="20" fill="#e6edf3">python3 nova_calc/nova_calc.py</text>
  <rect x="664" y="241" width="11" height="24" rx="2" fill="#22d3ee">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;1;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
