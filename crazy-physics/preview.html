<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
  <title>Crazy Physics Playground</title>
  <style>
:root {
  --bg: #070816; --panel: rgba(12, 16, 40, 0.62); --line: rgba(125, 249, 255, 0.18);
  --text: #eaf0ff; --muted: #9aa6d6; --accent: #7df9ff; --accent2: #ff6ec7;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; overflow: hidden;
  background: radial-gradient(circle at 20% 10%, #141b45, var(--bg) 55%);
  color: var(--text); font: 14px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif;
}
canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; touch-action: none; }

/* ---------- compact floating bar ---------- */
#ui {
  position: fixed; top: 12px; left: 12px; width: min(800px, calc(100vw - 24px));
  padding: 10px 14px 12px;
  border: 1px solid var(--line); border-radius: 18px;
  background: linear-gradient(160deg, rgba(125,249,255,.07), transparent 40%), var(--panel);
  backdrop-filter: blur(16px) saturate(150%); -webkit-backdrop-filter: blur(16px) saturate(150%);
  box-shadow: 0 14px 40px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.08);
  user-select: none;
}
#ui::before {
  content: ""; position: absolute; inset: 0 24px auto; height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent), var(--accent2), transparent); opacity: .8;
}
.top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.logo {
  width: 13px; height: 13px; border-radius: 50%; flex: none;
  background: radial-gradient(circle at 35% 30%, #fff, var(--accent) 45%, var(--accent2));
  box-shadow: 0 0 14px var(--accent), 0 0 26px rgba(255,110,199,.5); animation: pulse 2.6s ease-in-out infinite;
}
@keyframes pulse { 50% { transform: scale(1.25); box-shadow: 0 0 20px var(--accent), 0 0 36px rgba(255,110,199,.7); } }
h1 { flex: 1; margin: 0; font-size: 15px; font-weight: 800; white-space: nowrap; }
h1 span { background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.body { display: flex; align-items: center; gap: 22px; margin-top: 8px; }
#ui.collapsed .body { display: none; }

/* ---------- sliders ---------- */
.sliders { display: flex; gap: 16px; flex: 1; min-width: 0; }
.ctl { display: grid; gap: 2px; flex: 1; min-width: 80px; cursor: pointer; }
.ctl-h { display: flex; justify-content: space-between; font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .5px; text-transform: uppercase; }
output { color: var(--accent); font-variant-numeric: tabular-nums; font-weight: 700; }
input[type="range"] { --p: 50%; -webkit-appearance: none; appearance: none; width: 100%; height: 20px; margin: 0; background: transparent; cursor: pointer; }
input[type="range"]::-webkit-slider-runnable-track {
  height: 6px; border-radius: 99px;
  background: linear-gradient(90deg, var(--accent), var(--accent2)) no-repeat left / var(--p) 100%, rgba(255,255,255,.12);
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 16px; height: 16px; margin-top: -5px; border-radius: 50%; background: #fff; border: 0;
  box-shadow: 0 0 0 4px rgba(125,249,255,.2), 0 2px 8px rgba(0,0,0,.5); transition: box-shadow .15s, transform .15s;
}
input[type="range"]:hover::-webkit-slider-thumb { box-shadow: 0 0 0 6px rgba(125,249,255,.28), 0 2px 8px rgba(0,0,0,.5); }
input[type="range"]:active::-webkit-slider-thumb { transform: scale(1.15); }
input[type="range"]::-moz-range-track { height: 6px; border-radius: 99px; background: rgba(255,255,255,.12); }
input[type="range"]::-moz-range-progress { height: 6px; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; border: 0; border-radius: 50%; background: #fff; box-shadow: 0 0 0 4px rgba(125,249,255,.2); }
input[type="range"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 8px; }

/* ---------- buttons ---------- */
.actions { display: flex; gap: 6px; flex: none; }
button {
  font: inherit; color: var(--text); cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; padding: 7px 11px;
  border: 1px solid rgba(255,255,255,.1); border-radius: 12px; background: rgba(255,255,255,.045);
  transition: transform .12s, background .15s, border-color .15s, box-shadow .15s;
}
button:hover { background: rgba(125,249,255,.12); border-color: rgba(125,249,255,.5); transform: translateY(-1px); }
button:active { transform: translateY(1px) scale(.97); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button svg { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.lb { font-size: 12px; font-weight: 600; }
button.on { border-color: rgba(125,249,255,.55); background: rgba(125,249,255,.14); color: var(--accent); box-shadow: 0 0 14px rgba(125,249,255,.18); }
button.hot { border-color: rgba(255,110,199,.45); color: #ff9be0; background: rgba(255,110,199,.1); }
button.hot:hover { background: rgba(255,110,199,.25); border-color: var(--accent2); box-shadow: 0 0 18px rgba(255,110,199,.35); }
#pause .i-play { display: none; }
#pause.paused .i-play { display: block; }
#pause.paused .i-pause { display: none; }
#pause.paused { color: #ffd166; border-color: rgba(255,209,102,.5); background: rgba(255,209,102,.12); }
button.icon { padding: 6px; border-radius: 10px; }
#fold svg { transition: transform .2s; }
#ui.collapsed #fold svg { transform: rotate(180deg); }

/* ---------- stats chips ---------- */
#stats { display: flex; gap: 6px; align-items: center; }
.chip { padding: 2px 9px; border-radius: 99px; font-size: 11.5px; color: var(--muted); background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08); font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip b { color: var(--text); font-weight: 700; }
.chip.fps b { color: #7dffb3; }
#stats.paused::after { content: "PAUSED"; padding: 2px 9px; border-radius: 99px; font-size: 10.5px; font-weight: 800; letter-spacing: 1.4px; color: #ffd166; border: 1px solid rgba(255,209,102,.5); background: rgba(255,209,102,.1); }

/* ---------- shortcuts popover (closed by default) ---------- */
.keys { position: relative; }
.keys summary {
  list-style: none; cursor: pointer; padding: 4px 11px; border-radius: 99px; font-size: 12px; font-weight: 600; color: var(--muted);
  border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.045); transition: background .15s, color .15s;
}
.keys summary::-webkit-details-marker { display: none; }
.keys summary:hover, .keys[open] summary { color: var(--text); background: rgba(125,249,255,.12); border-color: rgba(125,249,255,.4); }
.keys summary span { color: var(--accent); font-weight: 800; margin-right: 2px; }
.keys ul {
  position: absolute; top: calc(100% + 14px); right: -60px; z-index: 5; width: min(420px, calc(100vw - 40px));
  margin: 0; padding: 14px; list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px;
  font-size: 12.5px; color: var(--muted);
  border: 1px solid var(--line); border-radius: 14px; background: rgba(10, 14, 34, .94);
  backdrop-filter: blur(14px); box-shadow: 0 16px 40px rgba(0,0,0,.5);
}
.keys li { display: flex; flex-direction: column; gap: 3px; }
kbd {
  display: inline-block; padding: 1px 6px; border-radius: 6px; font: 600 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text);
  background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); border-bottom-width: 2px;
}

@media (max-width: 760px) {
  .body { flex-direction: column; align-items: stretch; gap: 8px; }
  .actions { flex-wrap: wrap; } .actions button { flex: 1; justify-content: center; }
  h1 { flex-basis: 100%; order: -1; } .logo { display: none; }
}
@media (max-width: 520px) { .sliders { flex-direction: column; gap: 4px; } #stats .chip:nth-child(2) { display: none; } .keys ul { right: 0; } }
@media (prefers-reduced-motion: reduce) { .logo { animation: none; } button, input { transition: none; } }

#ui{top:max(12px,env(safe-area-inset-top,0px))}
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <aside id="ui" aria-label="Controls">
    <header class="top">
      <span class="logo" aria-hidden="true"></span>
      <h1>Crazy Physics <span>Playground</span></h1>
      <div id="stats">
        <span class="chip"><b id="sb">0</b> balls</span>
        <span class="chip"><b id="sw">0</b> wells</span>
        <span class="chip fps"><b id="sf">60</b> fps</span>
      </div>
      <details class="keys">
        <summary title="Shortcuts"><span aria-hidden="true">?</span> Keys</summary>
        <ul>
          <li><span><kbd>Drag</kbd></span> spawn &amp; attract</li>
          <li><span><kbd>Right-drag</kbd> <kbd>Shift</kbd></span> repel</li>
          <li><span><kbd>Dbl-click</kbd> <kbd>W</kbd></span> gravity well</li>
          <li><span><kbd>Space</kbd></span> blast at cursor</li>
          <li><span><kbd>B</kbd></span> burst of balls</li>
          <li><span><kbd>C</kbd></span> colour mode</li>
          <li><span><kbd>T</kbd></span> trails</li>
          <li><span><kbd>P</kbd> <kbd>R</kbd></span> pause · reset</li>
        </ul>
      </details>
      <button id="fold" class="icon" title="Collapse panel" aria-label="Collapse panel">
        <svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>
      </button>
    </header>

    <div class="body">
      <section class="sliders">
        <label class="ctl"><span class="ctl-h">Gravity <output id="gv"></output></span>
          <input id="g" type="range" min="-2" max="3" step="0.05" value="0.35"></label>
        <label class="ctl"><span class="ctl-h">Bounce <output id="bv"></output></span>
          <input id="b" type="range" min="0.2" max="1.2" step="0.01" value="0.92"></label>
        <label class="ctl"><span class="ctl-h">Chaos <output id="chv"></output></span>
          <input id="ch" type="range" min="0" max="2" step="0.01" value="1.50"></label>
      </section>

      <section class="actions">
        <button id="pause" title="Pause / resume (P)">
          <svg class="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>
          <svg class="i-play" viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z"/></svg>
          <span class="lb">Pause</span></button>
        <button id="color" title="Cycle colour mode (C)">
          <svg viewBox="0 0 24 24"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg>
          <span class="lb">Flow</span></button>
        <button id="trails" title="Toggle trails (T)">
          <svg viewBox="0 0 24 24"><path d="M3 17c4-8 8 4 12-4s4-3 6-3"/></svg>
          <span class="lb">Trails</span></button>
        <button id="burst" class="hot" title="Blast from the centre (Space = at cursor)">
          <svg viewBox="0 0 24 24"><path d="M12 2v5M12 17v5M2 12h5M17 12h5M5 5l3.5 3.5M15.5 15.5L19 19M19 5l-3.5 3.5M8.5 15.5L5 19"/></svg>
          <span class="lb">Blast</span></button>
        <button id="reset" title="Reset (R)">
          <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v5h5"/></svg>
          <span class="lb">Reset</span></button>
      </section>
    </div>
  </aside>
  <script type="module">
"use strict";
const MAX_BALLS = 600;
const WELL_LIFE = 420;
const STEP = 1 / 120; // fixed physics step (seconds)
const MAX_V = 20; // max displacement per step (px)
const CELL = 48; // spatial-hash cell size (>= largest ball diameter)
const $ = (id) => document.getElementById(id);
const canvas = $("c");
const ctx = canvas.getContext("2d");
const gInput = $("g");
const bInput = $("b");
const chInput = $("ch");
const stats = $("stats");
const panel = $("ui");
let W = 0, H = 0;
const DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
let balls = [];
let wells = [];
const mouse = { x: -1, y: -1, px: -1, py: -1, down: false, repel: false, inside: false };
let colorMode = 0;
let waves = [];
const WAVE_LIFE = 40;
const MODES = ["Flow", "Speed", "Size"];
let hueBase = 180, simT = 0, paused = false, trails = false;
let head = new Int32Array(0), next = new Int32Array(MAX_BALLS), cols = 0, rows = 0;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cols = Math.ceil(W / CELL) + 1;
    rows = Math.ceil(H / CELL) + 1;
    head = new Int32Array(cols * rows);
}
window.addEventListener("resize", resize);
resize();
const rand = (a, b) => a + Math.random() * (b - a);
function onHit(a, b, imp) {
    const s = Math.min(1, imp / 8), shift = imp * 9;
    a.hue = (a.hue + shift) % 360;
    b.hue = (b.hue - shift + 360) % 360; // colour shifts on impact
    a.flash = Math.max(a.flash, s);
    b.flash = Math.max(b.flash, s);
}
/** vx/vy are in px per 60fps-frame (kept from the original API). */
function addBall(x, y, vx = rand(-2, 2), vy = rand(-2, 2), r = rand(5, 22)) {
    if (balls.length >= MAX_BALLS)
        balls.shift();
    balls.push({
        x, y, px: x - vx * 0.5, py: y - vy * 0.5, ax: 0, ay: 0, r, m: r * r,
        hue: (hueBase + rand(-40, 40) + 360) % 360, flash: 0,
    });
}
function seed(n = 90) {
    balls = [];
    wells = [];
    waves = [];
    for (let i = 0; i < n; i++)
        addBall(rand(40, W - 40), rand(40, H - 40), rand(-3, 3), rand(-3, 3));
}
seed();
function addWell(x, y, repel = false) {
    wells.push({ x, y, t: WELL_LIFE, repel });
    for (let i = 0; i < 24; i++) {
        const a = (i / 24) * Math.PI * 2;
        addBall(x, y, Math.cos(a) * rand(1, 5), Math.sin(a) * rand(1, 5), rand(4, 12));
    }
}
function explode(cx, cy) {
    const power = 0.5 + Number(chInput.value) * 0.5;
    for (const b of balls) {
        const dx = b.x - cx, dy = b.y - cy;
        const d = Math.hypot(dx, dy) || 1;
        const dv = (16 * power * Math.exp(-d / 450)) / (1 + b.r / 40); // px/step, lighter balls fly further
        const ux = d > 1 ? dx / d : Math.cos(rand(0, 6.28)), uy = d > 1 ? dy / d : Math.sin(rand(0, 6.28));
        b.px -= ux * dv;
        b.py -= uy * dv;
        b.flash = 1;
    }
    waves.push({ x: cx, y: cy, t: WAVE_LIFE });
    hueBase = (hueBase + 47) % 360;
}
function setPaused(p) {
    paused = p;
    $("pause").classList.toggle("paused", p);
    $("stats").classList.toggle("paused", p);
    $("pause").querySelector(".lb").textContent = p ? "Resume" : "Pause";
}
function setColor(m) { colorMode = m % MODES.length; $("color").querySelector(".lb").textContent = MODES[colorMode]; }
function setTrails(t) { trails = t; $("trails").classList.toggle("on", t); }
// ---------- Input (pointer events: mouse + touch + pen) ----------
canvas.addEventListener("contextmenu", (e) => e.preventDefault());
canvas.addEventListener("pointermove", (e) => {
    mouse.px = mouse.inside ? mouse.x : e.clientX;
    mouse.py = mouse.inside ? mouse.y : e.clientY;
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.inside = true;
    if (mouse.down && !mouse.repel) {
        for (let i = 0; i < 2; i++)
            addBall(mouse.x + rand(-6, 6), mouse.y + rand(-6, 6), (mouse.x - mouse.px) * 0.25 + rand(-1.5, 1.5), (mouse.y - mouse.py) * 0.25 + rand(-1.5, 1.5), rand(3, 10));
    }
});
canvas.addEventListener("pointerdown", (e) => {
    canvas.setPointerCapture(e.pointerId);
    mouse.x = mouse.px = e.clientX;
    mouse.y = mouse.py = e.clientY;
    mouse.inside = true;
    mouse.down = true;
    mouse.repel = e.button === 2 || e.shiftKey;
});
const release = () => { mouse.down = false; };
canvas.addEventListener("pointerup", release);
canvas.addEventListener("pointercancel", release);
canvas.addEventListener("pointerleave", (e) => { if (e.pointerType === "mouse")
    mouse.inside = false; });
canvas.addEventListener("dblclick", (e) => addWell(e.clientX, e.clientY, e.shiftKey));
window.addEventListener("keydown", (e) => {
    if (e.target instanceof HTMLInputElement)
        return;
    const cx = mouse.inside ? mouse.x : W / 2, cy = mouse.inside ? mouse.y : H / 2;
    switch (e.key.toLowerCase()) {
        case " ":
            e.preventDefault();
            explode(cx, cy);
            break;
        case "r":
            seed();
            break;
        case "p":
            setPaused(!paused);
            break;
        case "t":
            setTrails(!trails);
            break;
        case "c":
            setColor(colorMode + 1);
            break;
        case "w":
            addWell(cx, cy, e.shiftKey);
            break;
        case "b":
            for (let i = 0; i < 40; i++)
                addBall(cx + rand(-20, 20), cy + rand(-20, 20), rand(-6, 6), rand(-6, 6));
            break;
    }
});
$("pause").addEventListener("click", () => setPaused(!paused));
$("color").addEventListener("click", () => setColor(colorMode + 1));
$("trails").addEventListener("click", () => setTrails(!trails));
$("reset").addEventListener("click", () => seed());
$("burst").addEventListener("click", (e) => { explode(W / 2, H / 2); e.currentTarget.blur(); });
$("fold").addEventListener("click", () => {
    panel.classList.toggle("collapsed");
});
// ---------- Physics ----------
function applyForces() {
    const g = Number(gInput.value) * 1200;
    const chaos = Number(chInput.value);
    const tA = simT * 20, tB = simT * 17;
    const pull = mouse.down && mouse.inside;
    const sign = mouse.repel ? -1 : 1;
    for (const b of balls) {
        b.ax = Math.sin((b.y + tA) * 0.01) * 40 * chaos;
        b.ay = g + Math.cos((b.x + tB) * 0.01) * 25 * chaos;
        if (pull) {
            const dx = mouse.x - b.x, dy = mouse.y - b.y;
            const f = (sign * 180000 * chaos) / (dx * dx + dy * dy + 600);
            b.ax += dx * f;
            b.ay += dy * f;
        }
        for (const w of wells) {
            const dx = w.x - b.x, dy = w.y - b.y;
            const f = ((w.repel ? -1 : 1) * 260000 * (w.t / WELL_LIFE) * chaos) / (dx * dx + dy * dy + 300);
            b.ax += dx * f;
            b.ay += dy * f;
        }
    }
    for (let i = waves.length - 1; i >= 0; i--) {
        waves[i].t -= STEP * 60;
        if (waves[i].t <= 0)
            waves.splice(i, 1);
    }
    for (let i = wells.length - 1; i >= 0; i--) {
        wells[i].t -= STEP * 60;
        if (wells[i].t <= 0)
            wells.splice(i, 1);
    }
}
function integrate() {
    const damp = 0.998, dt2 = STEP * STEP;
    for (const b of balls) {
        const vx = (b.x - b.px) * damp, vy = (b.y - b.py) * damp;
        b.hue = (b.hue + 10 * STEP) % 360;
        b.flash *= 0.985;
        b.px = b.x;
        b.py = b.y;
        b.x += vx + b.ax * dt2;
        b.y += vy + b.ay * dt2;
    }
}
function collideWalls() {
    const bounce = Number(bInput.value);
    for (const b of balls) {
        let vx = b.x - b.px, vy = b.y - b.py;
        if (b.x - b.r < 0) {
            b.x = b.r;
            b.px = b.x + vx * bounce;
        }
        else if (b.x + b.r > W) {
            b.x = W - b.r;
            b.px = b.x + vx * bounce;
        }
        if (b.y - b.r < 0) {
            b.y = b.r;
            b.py = b.y + vy * bounce;
        }
        else if (b.y + b.r > H) {
            b.y = H - b.r;
            b.py = b.y + vy * bounce;
        }
        vx = b.x - b.px;
        vy = b.y - b.py;
        const s = Math.hypot(vx, vy);
        if (s > MAX_V) {
            b.px = b.x - (vx / s) * MAX_V;
            b.py = b.y - (vy / s) * MAX_V;
        }
    }
}
function resolve(a, b, e) {
    let dx = b.x - a.x, dy = b.y - a.y;
    let dist = Math.hypot(dx, dy);
    const min = a.r + b.r;
    if (dist >= min)
        return;
    if (dist < 0.001) {
        dx = rand(-1, 1);
        dy = rand(-1, 1);
        dist = Math.hypot(dx, dy) || 1;
    }
    const nx = dx / dist, ny = dy / dist, inv = 1 / (a.m + b.m);
    const overlap = min - dist;
    a.x -= nx * overlap * b.m * inv;
    a.y -= ny * overlap * b.m * inv; // lighter ball moves more
    b.x += nx * overlap * a.m * inv;
    b.y += ny * overlap * a.m * inv;
    const vn = ((b.x - b.px) - (a.x - a.px)) * nx + ((b.y - b.py) - (a.y - a.py)) * ny;
    if (vn < 0) {
        const j = (-(1 + e) * vn) / (1 / a.m + 1 / b.m);
        a.px += (nx * j) / a.m;
        a.py += (ny * j) / a.m;
        b.px -= (nx * j) / b.m;
        b.py -= (ny * j) / b.m;
        onHit(a, b, -vn);
    }
}
/** Spatial hash: ~O(n) instead of O(n²) pair checks. */
function collideBalls() {
    const e = Math.min(1, Number(bInput.value)) * 0.92;
    head.fill(-1);
    const n = balls.length;
    for (let i = 0; i < n; i++) {
        const b = balls[i];
        const cx = Math.min(cols - 1, Math.max(0, (b.x / CELL) | 0));
        const cy = Math.min(rows - 1, Math.max(0, (b.y / CELL) | 0));
        const c = cy * cols + cx;
        next[i] = head[c];
        head[c] = i;
    }
    for (let cy = 0; cy < rows; cy++) {
        for (let cx = 0; cx < cols; cx++) {
            for (let i = head[cy * cols + cx]; i !== -1; i = next[i]) {
                for (let oy = 0; oy <= 1; oy++) {
                    for (let ox = -1; ox <= 1; ox++) {
                        if (oy === 0 && ox < 0)
                            continue; // forward neighbours only
                        const nx = cx + ox, ny = cy + oy;
                        if (nx < 0 || nx >= cols || ny >= rows)
                            continue;
                        let j = head[ny * cols + nx];
                        if (ox === 0 && oy === 0)
                            j = next[i]; // same cell: only later entries
                        for (; j !== -1; j = next[j])
                            resolve(balls[i], balls[j], e);
                    }
                }
            }
        }
    }
}
// ---------- Rendering ----------
function draw() {
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = trails ? "rgba(7, 8, 22, 0.22)" : "rgb(7, 8, 22)";
    ctx.fillRect(0, 0, W, H);
    for (const w of wells) {
        const k = w.t / WELL_LIFE, r = 30 + (1 - k) * 120;
        const rgb = w.repel ? "255,110,199" : "125,249,255";
        const g = ctx.createRadialGradient(w.x, w.y, 0, w.x, w.y, r);
        g.addColorStop(0, `rgba(${rgb},${0.22 * k})`);
        g.addColorStop(1, `rgba(${rgb},0)`);
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(w.x, w.y, r, 0, Math.PI * 2);
        ctx.fill();
    }
    for (const w of waves) {
        const k = w.t / WAVE_LIFE, r = 20 + (1 - k) * Math.max(W, H) * 0.7;
        ctx.strokeStyle = `rgba(255,255,255,${0.6 * k})`;
        ctx.lineWidth = 2 + 8 * k;
        ctx.beginPath();
        ctx.arc(w.x, w.y, r, 0, Math.PI * 2);
        ctx.stroke();
    }
    ctx.globalCompositeOperation = "lighter";
    for (const b of balls) {
        const v = Math.hypot(b.x - b.px, b.y - b.py) * 2; // px per 60fps frame
        const h = colorMode === 1 ? 240 - Math.min(1, v / 8) * 240 : colorMode === 2 ? ((b.r - 3) / 19) * 300 : b.hue;
        ctx.fillStyle = `hsla(${h} 95% 62% / ${Math.min(1, 0.18 + v * 0.04 + b.flash * 0.5)})`;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r + Math.min(14, v * 1.2 + b.flash * 8), 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = `hsla(${h} 100% ${72 + b.flash * 22} / 0.95)`;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";
}
// ---------- Main loop ----------
let tPrev = performance.now(), acc = 0, fps = 60, statT = 0;
function frame(now) {
    const dt = Math.min(0.05, Math.max(0.0001, (now - tPrev) / 1000));
    tPrev = now;
    fps += (1 / dt - fps) * 0.05;
    if (!paused) {
        acc += dt;
        for (let s = 0; acc >= STEP && s < 6; s++, acc -= STEP) {
            applyForces();
            integrate();
            collideBalls();
            collideWalls();
            simT += STEP;
        }
        if (acc > STEP)
            acc = 0; // drop backlog instead of spiralling
    }
    draw();
    if (now - statT > 250) {
        statT = now;
        $("sb").textContent = `${balls.length}/${MAX_BALLS}`;
        $("sw").textContent = String(wells.length);
        $("sf").textContent = fps.toFixed(0);
    }
    requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// ---------- Slider polish: live value readout, gradient fill, double-click to reset ----------
document.querySelectorAll('input[type="range"]').forEach((r) => {
    const out = $(r.id + "v");
    const update = () => {
        out.textContent = Number(r.value).toFixed(2);
        r.style.setProperty("--p", ((Number(r.value) - Number(r.min)) / (Number(r.max) - Number(r.min))) * 100 + "%");
    };
    r.addEventListener("input", update);
    r.addEventListener("dblclick", () => { r.value = r.defaultValue; update(); });
    r.title = "Double-click to reset";
    update();
});

</script>
</body>
