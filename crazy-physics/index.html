<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crazy Physics Playground</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <canvas id="c"></canvas>
  <div id="ui">
    <div class="row"><strong>Crazy Physics Playground</strong></div>
    <div class="row">Click/drag: attract & fling | Double-click: gravity well | Space: explosion | R: reset</div>
    <div class="row">
      <label>Gravity <input id="g" type="range" min="-2" max="3" step="0.05" value="0.35"></label>
      <label>Bounce <input id="b" type="range" min="0.2" max="1.2" step="0.01" value="0.92"></label>
      <label>Chaos <input id="ch" type="range" min="0" max="2" step="0.01" value="1"></label>
    </div>
    <div class="row" id="stats"></div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
